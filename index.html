<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colorín Colorado</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖍️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.2 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.7 5.8a9 9 0 0 1 0 12.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <h1>Colorín Colorado</h1>
      <div class="crayons" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <p class="tag">Aprende español jugando</p>
    </div>
    <div class="stars" id="stars" aria-label="Tus estrellas">
      <svg class="star" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star"/></svg>
      <b id="starCount">0</b><span>estrellas</span>
    </div>
  </header>

  <div class="tabs" id="tabs" role="group" aria-label="Elige un juego">
    <button type="button" class="tab" data-mode="alfabeto" aria-pressed="true">Alfabeto</button>
    <button type="button" class="tab" data-mode="aprender" aria-pressed="false">Aprender</button>
    <button type="button" class="tab" data-mode="adivina" aria-pressed="false">Adivina</button>
    <button type="button" class="tab" data-mode="memoria" aria-pressed="false">Memoria</button>
    <button type="button" class="tab" data-mode="silabas" aria-pressed="false">Sílabas</button>
    <button type="button" class="tab" data-mode="escritura" aria-pressed="false">Escritura</button>
  </div>

  <div class="controls" id="controls">
    <div class="chips" id="chips" role="group" aria-label="Elige un tema"></div>
    <button type="button" class="switch" id="enSwitch" role="switch" aria-checked="false">
      <span class="track"><span class="thumb"></span></span><span>Mostrar inglés</span>
    </button>
  </div>

  <section class="panel" id="panel"></section>

  <p class="foot">Sube el volumen para escuchar las palabras en español. Hecho con ❤️ para pequeños lectores.</p>
</div>

<script src="app.js"></script>
</body>
</html>
